name: settlement_reconciliation
version: 0.1.0
profile: settlement_reconciliation

model-paths: [models]
test-paths: [tests]
snapshot-paths: [snapshots]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # Floor for the daily match rate. Observed minimum is 0.725 on 2026-08-24 (n=40), a day
  # carrying the whole unexplained backlog. The floor sits under it so the build reports the
  # current state instead of failing on a historical incident.
  min_daily_match_rate: 0.70

  # Accepted size of the unexplained break population. Any unexplained row warns, the twelfth
  # errors.
  unexplained_break_baseline: 11

snapshots:
  settlement_reconciliation:
    +target_schema: main

models:
  settlement_reconciliation:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
