name: dbt build

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DBT_PROFILES_DIR: .
  # The private sqlite is not available on a runner, so sources read the committed fixture.
  DBT_DATA_DIR: fixtures

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install pinned dbt stack and linter
        run: |
          uv venv --python 3.12
          uv pip install -r pyproject.toml --group lint

      - name: Install dbt packages
        run: .venv/bin/dbt deps

      - name: Lint SQL
        run: .venv/bin/sqlfluff lint models tests snapshots

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install pinned dbt stack
        run: |
          uv venv --python 3.12
          uv pip install -r pyproject.toml

      - name: Install dbt packages
        run: .venv/bin/dbt deps

      - name: Build models and run tests
        run: .venv/bin/dbt build

      - name: Generate docs
        run: .venv/bin/dbt docs generate --static

      # --static emits one self-contained file. Pages serves a directory.
      - name: Assemble docs site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          cp target/static_index.html site/index.html

      - name: Upload docs site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: docs-page

  verify-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install pinned dbt stack
        run: |
          uv venv --python 3.12
          uv pip install -r pyproject.toml

      - name: Install dbt packages
        run: .venv/bin/dbt deps

      - name: Inject a fault per control and check the control catches it
        run: .venv/bin/python scripts/verify_controls.py

  publish-docs:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
        with:
          artifact_name: docs-page
